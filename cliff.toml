# git-cliff configuration — https://git-cliff.org/docs/configuration
# Changelog is rendered by Tera templates; every `{% ... %}` / `{{ ... }}`
# block is evaluated at render time.

[changelog]
header = """\
# Changelog

All notable changes to this project will be documented in this file.

This changelog is generated from the project's git history by
[git-cliff](https://git-cliff.org). Mayhem commits are grouped both by the
**drill phase** that produced them (Explore / Expert / Coverage / Next) and
by conventional-commit type — see the phase map below.
"""

body = '''{% if version %}
## {{ version | trim_start_matches(pat='v') }} - {{ timestamp | date(format='%Y-%m-%d') }}
{% else %}
## [unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute='group') %}

### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
'''

footer = """\
<!-- generated by git-cliff -->
"""

trim = true

# ── Phase-aware grouping ────────────────────────────────────────────────
# git-cliff assigns a commit to the group of the FIRST parser that matches.
# Cliff-phase parsers are listed first, so a commit whose scope names a
# Mayhem drill phase lands in that phase's section; anything else falls
# through to the conventional-type parsers below. The message regexes are
# deliberately permissive (`^feat\\(explore\\)`, not `^feat`) so phase
# grouping keyed on the CLI drill scope wins before type grouping.
commit_parsers = [
    # ── Drill phases (scope → phase) ──
    { message = "^feat\\(explore\\)",  group = "Phase A · Explore" },
    { message = "^fix\\(explore\\)",   group = "Phase A · Explore" },
    { message = "^feat\\(expert\\)",   group = "Phase B · Expert" },
    { message = "^fix\\(expert\\)",    group = "Phase B · Expert" },
    { message = "^feat\\(coverage\\)", group = "Phase C · Coverage" },
    { message = "^fix\\(coverage\\)",  group = "Phase C · Coverage" },
    { message = "^feat\\(next\\)",     group = "Phase D · Next" },
    { message = "^fix\\(next\\)",      group = "Phase D · Next" },
    # ── Conventional-commit type fallback ──
                    # ── Drill: phases also ──
                    { message = "^feat\\(explore", group = "Phase A · Explore" },
                    { message = "^feat\\(expert", group = "Phase B · Expert Drill" },
                    { message = "^feat\\(coverage", group = "Phase C · Coverage" },
                    { message = "^feat\\(next", group = "Phase D · Next" },
                    # ── Drill: type fallthrough ──
                    { message = "^feat", group = "Features" },
    { message = "^fix",      group = "Bug Fixes" },
    { message = "^perf",     group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^docs",     group = "Docs" },
    { message = "^test",     group = "Testing" },
    { message = "^build",    group = "Build" },
    { message = "^ci",       group = "CI" },
    { message = "^style",    group = "Style" },
    { message = ".*",        group = "Other" },
]

# Keep everything; unconventional messages fall to the catch-all.
filter_commits = false
sort_commits = "oldest"

[git]
# Traditional commit messages are handled; Mayhem also uses
# conventional-commit prefixes for the drill scopes above.
conventional_commits = true
filter_unconventional = false

# Only true release tags (`0.5.1`) become changelog sections; the
# `0.5.0dev` / `0.2.0dev` milestones fold into their final release.
tag_pattern = "^[0-9]+(\\.[0-9]+)+$"
# Sort commits topologically inside git so ranges are stable across runs.
topo_order = true
