# git-cliff configuration — https://git-cliff.org/docs/configuration
# Changelog is rendered by Tera templates; every `{% ... %}` / `{{ ... }}`
# block is evaluated at render time.

[changelog]
header = """\
# Changelog

All notable changes to this project will be documented in this file.
Conventional commits drive the grouping below; see
https://www.conventionalcommits.org/ for the message format.
"""

body = '''{% if version %}
## {{ version | trim_start_matches(pat='v') }} - {{ timestamp | date(format='%Y-%m-%d') }}
{% else %}
## [unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute='group') %}

### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
'''

footer = """\
<!-- generated by git-cliff -->
"""
trim = true

[git]
# Conventional commits feed the group mappings below.
conventional_commits = true
# Keep every commit — unconventional messages fall through to the
# catch-all "Other" parser instead of being dropped.
filter_unconventional = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^docs", group = "Docs" },
    { message = "^test", group = "Testing" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "CI" },
    { message = "^style", group = "Style" },
    { message = ".*", group = "Other" },
]
filter_commits = false
sort_commits = "oldest"
# Only true release tags (`0.5.1`) become changelog sections; the
# `0.5.0dev` / `0.2.0dev` milestones fold into their final release.
tag_pattern = "^[0-9]+(\\.[0-9]+)+$"
# Sort commits topologically inside git so ranges are stable across runs.
topo_order = true