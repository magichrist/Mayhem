apiVersion: "mayhem/v1"
kind: drill
name: testcase-fault-drill
hypothesis: "testCase stack recovers from every injected fault"

config:
  risk_ceiling: critical
  max_faults: 1
  timeout: 30m
  log_level: INFO

containers:
  testcase-api:
    faults:
      - fault: proc.pause
        duration: 10s
        on_failure: abort_and_recover
      - fault: mem.exhaust
        amount: 256M
        duration: 20s
  
  testcase-lb:
    faults:
      - fault: proc.pause
        duration: 10s
      - fault: mem.exhaust
        amount: 256M
        duration: 20s
      - fault: cpu.saturate
        percent: 75
        duration: 10s
      - fault: fs.fill
        percent: 60
        duration: 10s
      - fault: fd.exhaust
        limit: 128
        duration: 10s
      - fault: load.spike
        rps: 100
        seconds: 10s
      - fault: fuzz.protocol_abuse
        duration: 5s
      - fault: net.latency
        seconds: 5s
        jitter_ms: 10
        duration: 10s
      - fault: net.partition
        duration: 10s
      - fault: container.kill
        signal: SIGKILL
        duration: 10s
      - fault: node.service_stop
        duration: 10s
      - fault: http.error_injection
        status: 500
        duration: 10s
      - fault: db.slow_query
        seconds: 5s
        duration: 10s
      - fault: dns.resolve_delay
        seconds: 5s
        duration: 10s
      - fault: dns.nxdomain
        domain: example.com
        duration: 10s
      - fault: tls.certificate_expired
        duration: 10s
      - fault: clock.skew
        offset_ms: 1000
        duration: 10s

  testcase-download-1:
    faults:
      - fault: proc.pause
        duration: 10s

execution:
  - parallel: [testcase-api, testcase-download-1]
  - wait: 5s
  - check:
      - http: http://testcase-api:8080/
        expect: { status: 200 }
  - sequential: [testcase-lb]
  - wait: 3s
  - check:
      - http: http://testcase-api:8080/
        expect: { status: 200 }
