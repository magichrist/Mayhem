apiVersion: "mayhem/v1"
kind: drill
name: testcase-fault-drill
hypothesis: "testCase stack recovers from every injected fault"

config:
  risk_ceiling: critical
  max_faults: 1
  timeout: 30m
  log_level: INFO
  # true (default): auto-recover the container after each fault.
  # false: keep the fault in place — downstream checks observe whether
  #        the stack self-heals without the engine reviving anything.
  recovery: true
  # Default failure policy for every fault round:
  #   continue           record the failure and keep testing the remaining faults
  #   abort_and_recover  cancel the remaining steps and recover on first failure
  # A fault can override this per-fault (see testcase-api's proc.pause below).
  on_failure: continue 

containers:
  testcase-api:
    faults:
      - fault: proc.pause
        duration: 10s
        on_failure: abort_and_recover
      - fault: mem.exhaust
        params:
          amount: 256M
        duration: 20s
      - fault: container.restart
        duration: 10s
      - fault: net.load
        users: 100
        duration: 10s
        url: http://testcase-api:8080/

      # ── application / upstream response behaviour ─────────────────────
      - fault: app.response_5xx
        params:
          status: 500
          probability: 100
          port: 8080
        duration: 10s
      - fault: http.upstream_timeout
        params:
          upstream: http://testcase-lb:8080/
          timeout_ms: 1000
          port: 8080
        duration: 10s

      # ── egress faults against the postgres dependency (:5432) ──────────
      - fault: dependency.connection_refuse
        params:
          port: 5432
          protocol: tcp
        duration: 10s
      - fault: net.connection_refuse
        params:
          port: 5432
          protocol: tcp
        duration: 10s
      - fault: net.connection_reset
        params:
          port: 5432
          protocol: tcp
        duration: 10s

      # ── packet-level network faults ────────────────────────────────────
      - fault: net.congestion
        params:
          rate_kbps: 128
        duration: 10s
      - fault: net.corrupt
        params:
          percent: 1.0
        duration: 10s
      - fault: net.duplicate
        params:
          percent: 1.0
          direction: egress
        duration: 10s
      - fault: net.reorder
        params:
          percent: 1.0
          delay_ms: 50
          direction: egress
        duration: 10s

      # ── process lifecycle ──────────────────────────────────────────────
      - fault: process.kill
        duration: 10s
      - fault: process.crash_loop
        params:
          restarts: 3
          interval: 2s
        duration: 20s
      - fault: process.restart_delay
        params:
          restarts: 3
          delay: 5s
        duration: 20s

      # ── cpu / memory pressure ──────────────────────────────────────────
      - fault: cpu.burst
        params:
          percent: 95
        duration: 10s
      - fault: mem.freeze
        params:
          percent: 90
          hold_s: 30s
        duration: 35s
      - fault: mem.swap_pressure
        params:
          percent: 80
          swap_mb: 64
        duration: 10s


  testcase-lb:
    faults:
      - fault: clock.skew
        offset_ms: 1000
        duration: 10s
      - fault: container.kill
        params:
          signal: SIGKILL
        duration: 30s
      - fault: container.pause
        duration: 10s
      - fault: container.restart
        duration: 10s
      - fault: cpu.saturate
        percent: 75
        duration: 10s
      - fault: cpu.throttle
        percent: 50
        duration: 10s
      - fault: db.connection_exhaust
        params:
          connections: 32
          host: testcase-db
          port: 3306
        duration: 10s
      - fault: db.query_error
        params:
          probability: 100
          error: deadlock
          port: 3306
        duration: 10s
      - fault: db.slow_query
        seconds: 5s
        duration: 10s
      - fault: dependency.block
        port: 5432
        duration: 10s
      - fault: dependency.flap
        port: 5432
        duration: 10s
      - fault: dependency.rate_limit
        rate: 20
        duration: 10s
      - fault: dependency.timeout
        params:
          port: 5432
          delay_ms: 500
        duration: 10s
      - fault: dns.nxdomain
        domain: example.com
        duration: 10s
      - fault: dns.resolve_delay
        seconds: 5s
        duration: 10s
      - fault: dns.servfail
        duration: 10s
      - fault: dns.timeout
        duration: 10s
      - fault: fd.exhaust
        limit: 128
        duration: 10s
      - fault: fs.fill
        percent: 60
        duration: 10s
      - fault: fs.inode_exhaust
        percent: 60
        duration: 10s
      - fault: fs.io_stress
        params:
          seconds: 5s
          workers: 2
          io_bytes: 64M
        duration: 10s
      - fault: fuzz.protocol_abuse
        duration: 5s
      - fault: http.error_injection
        status: 500
        duration: 10s
      - fault: http.latency
        delay_ms: 200
        duration: 10s
      - fault: load.spike
        rps: 100
        seconds: 10s
      - fault: mem.exhaust
        amount: 256M
        duration: 20s
      - fault: mem.leak
        rate_mb: 8
        duration: 10s
      - fault: net.bandwidth
        rate: 10mbit
        duration: 10s
      - fault: net.latency
        seconds: 5s
        jitter_ms: 10
        duration: 10s
      - fault: net.load
        users: 10
        url: http://testcase-api:8080/
        duration: 10s
      - fault: net.packet_loss
        percent: 10
        duration: 10s
      - fault: net.partition
        duration: 10s
      - fault: node.service_stop
        duration: 10s
      - fault: proc.pause
        duration: 10s
#      - fault: process.kill
#        duration: 10s
      - fault: process.stop
        duration: 10s
      - fault: tls.certificate_expired
        duration: 10s
      - fault: tls.handshake_failure
        port: 443
        duration: 10s

  testcase-download-1:
    faults:
      - fault: proc.pause
        duration: 10s

      # ── filesystem faults (./data is mounted read-only, so these act
      #    on the container's own rootfs) ─────────────────────────────────
      - fault: fs.quota
        params:
          quota_mb: 64
        duration: 10s
      - fault: fs.read_only
        params:
          path: /
        duration: 10s
      - fault: fs.write_delay
        params:
          delay_ms: 100
        duration: 10s

execution:
  - parallel: [testcase-api, testcase-download-1]
  - wait: 5s
  - check:
      - http: http://testcase-api:8080/
        expect: { status: 200 }
  - sequential: [testcase-lb]
  - wait: 3s
  - check_spec:
      - id: api-health
        probe:
          type: http
          url: http://testcase-api:8080/
          method: GET
          timeout: 5s
          expected_status: 200
        execution: container
        target: testcase-lb
        expect:
          status: 200

success:
  criteria:
    - type: status
      source_id: check-0004-0.status
      expected: 200
  require_all: true

observability:
  sources:
    - kind: logs
      source_id: api.logs
      container: testcase-api
      tail: 100
      timeout: 10s
    - kind: probe
      source_id: api.http
      probe:
        type: http
        url: http://testcase-api:8080/
        method: GET
        timeout: 5s
        expected_status: 200
      cadence: 5s
      timeout: 10s
  cadence: 5s
  total_timeout: 30s
