services:
  # ── Download servers ────────────────────────────────────────────────────
  # Two identical python http.server replicas behind the load balancer.
  # Serves static files from /srv/data inside each container.
  download-1:
    image: docker.io/library/python:3.13-alpine
    command: python -m http.server 8000 --directory /srv/data
    volumes:
      - ./data:/srv/data:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  download-2:
    image: docker.io/library/python:3.13-alpine
    command: python -m http.server 8000 --directory /srv/data
    volumes:
      - ./data:/srv/data:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ── Load balancer / reverse proxy ───────────────────────────────────────
  # Round-robin across the two download servers; passes through client IPs
  # and sets standard proxy headers.
  lb:
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      download-1:
        condition: service_healthy
      download-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ── PostgreSQL database ─────────────────────────────────────────────────
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: mayhem
      POSTGRES_PASSWORD: mayhem
      POSTGRES_DB: mayhem
    expose:
      - "5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mayhem -d mayhem"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pg-data:
