# Deterministic drill: pause the download-1 process briefly, then verify recovery.
kind: deterministic
name: proc-pause-drill
hypothesis: a 10s pause of the download-1 process is survivable without user impact
labels:
  team: platform
constraints:
  risk_ceiling: medium
steps:
  - id: pause
    inject_fault:
      fault: proc.pause
      targets:
        - kind: process
          expr: "name=download-1"
      duration: 10s
    on_failure: abort_and_recover
  - id: settle
    wait: 2s
