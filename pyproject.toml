[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI is `mayhem-cli` (the bare `mayhem` name is taken);
# the installed console commands stay `mayhem` and `mayhem-agent`.
name = "mayhem-cli"
dynamic = ["version"]
description = "General-purpose chaos engineering and resilience-testing framework: a chaos experiment orchestration engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Mayhem Engineering" }]
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "click>=8.1",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.scripts]
mayhem = "mayhem.cli.app:main"
mayhem-agent = "mayhem.agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "types-pyyaml>=6.0",
]

[tool.hatch.version]
# Version flows from the nearest git tag (`v0.5.0` → 0.5.0), so a
# tag-push release always ships a clean PEP 440 version. Untagged
# local builds fall back to the dev version below.
source = "vcs"
fallback-version = "0.5.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/mayhem"]

# --- Ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "DTZ",         # datetime tz discipline
    "T10",         # debugger calls
    "EM",          # exception message hygiene
    "ICN",         # import conventions
    "PIE",         # misc
    "RET",         # return discipline
    "SIM",         # simplification
    "TC",          # type-checking imports (TCH renamed)
    "PTH",         # use pathlib
    "PL",          # pylint subset
    "RUF",         # ruff-specific
]
ignore = [
    "PLR0913",  # many arguments allowed in domain constructors
    "PLR2004",  # magic values in state-machine tables are intentional
    "EM101",    # domain raises typed DomainError subclasses with short inline msgs
    "EM102",
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves model annotations at runtime; field types must stay
# runtime-visible rather than hiding under TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "SIM117", "PLC0415"]
# CLI commands keep heavy imports inside handlers so `--help` stays instant,
# and typer's own API *is* Option(...) in argument defaults.
"src/mayhem/cli/**" = ["PLC0415", "PLR0917"]
"src/mayhem/cli/app.py" = ["PLR0911"]
# safety.py keeps catalog/topology imports inside helpers on purpose (see the
# "local:" comments) — hoisting them would create import cycles.
"src/mayhem/controller/safety.py" = ["PLC0415"]

# --- Mypy --------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --- Pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "nightly: chaos-of-the-chaos tier (deselect with '-m \"not nightly\"')",
]

# --- import-linter -------------------------------------------------------------
[tool.importlinter]
root_packages = ["mayhem"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain layer has zero IO and no upward imports"
type = "forbidden"
source_modules = ["mayhem.domain"]
forbidden_modules = [
    "mayhem.toolkit",
    "mayhem.agents",
    "mayhem.controller",
    "mayhem.infra",
    "asyncio",
    "socket",
    "subprocess",
    "sqlite3",
    "pathlib",
    "os",
]

[[tool.importlinter.contracts]]
name = "Layered architecture: domain <- infra/toolkit/agents <- controller"
type = "layers"
containers = ["mayhem"]
layers = [
    "controller",
    "agents",
    "toolkit | infra",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Agents never import controller modules"
type = "forbidden"
source_modules = ["mayhem.agents"]
forbidden_modules = ["mayhem.controller"]
