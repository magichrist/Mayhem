[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI is `mayhem-cli`; the installed command is `mayhem`.
name = "mayhem-cli"
dynamic = ["version"]
description = "General-purpose chaos engineering and resilience-testing framework: a chaos experiment orchestration engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Mayhem Engineering" }]
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "click>=8.1",
    "pyyaml>=6.0",
    "structlog>=24.1",
    # The Kubernetes client is a default dependency: there is no `k8s` extra.
    # A reachable cluster and its capabilities are still runtime requirements,
    # but installing the distribution is enough to import the Kubernetes lanes.
    "kubernetes>=31",
]

[project.scripts]
mayhem = "mayhem.cli.app:main"
mayhem-agent = "mayhem.agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "types-pyyaml>=6.0",
    "kubernetes>=31",
]

[tool.hatch.version]
# Version flows from the nearest git tag (this repository tags releases as
# `0.8.0`, without a `v` prefix, so the tag maps to the PEP 440 version
# 0.8.0). A tag-push release always ships a clean version. Untagged local
# builds fall back to the in-development release line below.
source = "vcs"
# Only used when no git tag is reachable (exported tarballs, vendored copies).
# It does NOT make a 1.0.0 release: the release version comes from the tag.
fallback-version = "1.0.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/mayhem"]

# --- Ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "DTZ",         # datetime tz discipline
    "T10",         # debugger calls
    "EM",          # exception message hygiene
    "ICN",         # import conventions
    "PIE",         # misc
    "RET",         # return discipline
    "SIM",         # simplification
    "TC",          # type-checking imports (TCH renamed)
    "PTH",         # use pathlib
    "PL",          # pylint subset
    "RUF",         # ruff-specific
]
ignore = [
    "PLR0913",  # many arguments allowed in domain constructors
    "PLR2004",  # magic values in state-machine tables are intentional
    "EM101",    # domain raises typed DomainError subclasses with short inline msgs
    "EM102",
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves model annotations at runtime; field types must stay
# runtime-visible rather than hiding under TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR0915",
    "SIM117",
    "PLC0415",
    "PLR0917",
    # Test code legitimately does the three things below that src code must not:
    #   TC002/TC003 - imports a test needs at *runtime* (fixtures, parametrize
    #     targets, `pytest.raises` types) cannot move into a TYPE_CHECKING block.
    #   B017 - `pytest.raises(Exception)` is the correct assertion when the test
    #     is "this input is refused somehow"; narrowing it would change what is
    #     under test, not tighten it.
    #   PLW1510 - these subprocess calls assert on `returncode` explicitly, which
    #     is the whole point of the assertion.
    "TC002",
    "TC003",
    "B017",
    "PLW1510",
]
# CLI commands keep heavy imports inside handlers so `--help` stays instant,
# and typer's own API *is* Option(...) in argument defaults.
"src/mayhem/cli/**" = ["PLC0415", "PLR0917"]
"src/mayhem/providers/builtin.py" = ["PLC0415"]
"src/mayhem/cli/toolkit.py" = ["PLR0912"]
"src/mayhem/cli/app.py" = ["PLR0911", "PLR0912"]
"src/mayhem/cli/errors.py" = ["PLR0911", "PLR0912"]
"src/mayhem/cli/renderers.py" = ["PLR0911"]
"src/mayhem/cli/lifecycle.py" = ["PLR0911", "PLR0912", "PLR0915", "E501"]
"src/mayhem/cli/topology.py" = ["E501"]
"src/mayhem/agents/k8s_resolve.py" = ["PLC0415"]
"src/mayhem/controller/executor.py" = [
    "B007",
    "E501",
    "F841",
    "PLC0415",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "SIM105",
    "TC001",
]
"src/mayhem/agents/executors.py" = [
    "E501",
    "PLC0415",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "PLR0917",
    "RET503",
    "RUF002",
    "RUF012",
    "SIM108",
]
"src/mayhem/controller/k8s_runtime.py" = ["PLC0415", "E501"]
# safety.py keeps catalog/topology imports inside helpers on purpose (see the
# "local:" comments) — hoisting them would create import cycles.
"src/mayhem/controller/safety.py" = ["PLC0415", "E501", "PLR0912"]
"src/mayhem/cli/execution.py" = ["E501"]
"src/mayhem/cli/render.py" = ["E501", "PLC0415"]
"src/mayhem/controller/preflight.py" = ["F401", "E501", "PLC0415", "PLR0912", "PLR0915", "C409"]
# PLC0415 below is a *consequence* of the documented `controller -> cli`
# inversion (see the "Nothing below the controller imports the CLI layer"
# contract's KNOWN DEBT block): these function-local imports of
# `mayhem.cli.services` / `mayhem.cli.proof_cmd` exist to dodge an import cycle
# the inversion created. Hoisting them would not fix the direction, it would
# just make the violation unmissable. The debt is recorded; the fix is a real
# refactor moving the view builders into controller/, and it is not done here.
"src/mayhem/controller/api_service.py" = ["PLC0415"]
"src/mayhem/controller/cell_runner.py" = ["PLC0415"]
"src/mayhem/controller/check_gate.py" = ["PLC0415"]
"src/mayhem/controller/enterprise_walkthrough.py" = ["PLC0415", "PLR0911", "PLR0915"]
"src/mayhem/controller/support_bundle.py" = ["PLC0415"]
# `run_walkthrough` is a ten-step state machine whose value is the ordered
# transcript, not any single branch; flattening it to satisfy a return-count
# limit would obscure the sequence the acceptance criterion reads.
"src/mayhem/controller/cloud_evidence.py" = ["PLR0911"]
"src/mayhem/controller/k8s_fabric.py" = []
"src/mayhem/domain/policy.py" = ["PLR0911"]
"src/mayhem/cli/marketplace_cmd.py" = ["PLR0912"]
"src/mayhem/controller/plan_diff.py" = ["E501", "PLC0415"]
"src/mayhem/infra/evidence.py" = ["E501", "PLC0415"]
"src/mayhem/infra/diagnostics.py" = ["E501", "PLC0415"]
"src/mayhem/domain/preflight.py" = ["E501", "PLC0415"]
"src/mayhem/domain/evidence.py" = ["E501"]

# --- Mypy --------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --- Pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "nightly: chaos-of-the-chaos tier (deselect with '-m \"not nightly\"')",
    "implicit_execution: opt in to the MAYHEM_ALLOW_IMPLICIT_EXECUTION=1 compat switch (v0.9.0 execution intent)",
    "package: builds and installs the distribution; requires MAYHEM_PACKAGE_SMOKE=1",
]

# --- import-linter -------------------------------------------------------------
# Requires: `uv sync --group dev` (or `pip install import-linter`). The package
# exposes `lint-imports`; run it from the repo root so it picks up this table:
#     .venv/bin/lint-imports --config pyproject.toml
# Nothing in the test suite shells out to it, so an environment without
# import-linter installed is a gap here, not a collection failure.
[tool.importlinter]
root_packages = ["mayhem"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain layer has zero IO and no upward imports"
type = "forbidden"
source_modules = ["mayhem.domain"]
forbidden_modules = [
    "mayhem.toolkit",
    "mayhem.agents",
    "mayhem.controller",
    "mayhem.infra",
    "asyncio",
    "socket",
    "subprocess",
    "sqlite3",
    "pathlib",
    "os",
]

[[tool.importlinter.contracts]]
name = "Layered architecture: domain <- infra/toolkit/agents <- controller"
type = "layers"
containers = ["mayhem"]
layers = [
    "controller",
    "agents",
    "toolkit | infra",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Agents never import controller modules"
type = "forbidden"
source_modules = ["mayhem.agents"]
forbidden_modules = ["mayhem.controller"]

[[tool.importlinter.contracts]]
# The `cli` layer is deliberately NOT in the layers contract above, because 11
# pre-existing `controller -> cli` imports exist and adding it would fail the
# build (see KNOWN DEBT below). This contract closes the part that is closeable
# today and stops the inversion spreading further downward: nothing below the
# controller may depend on the presentation layer. Verified green — there are
# currently zero such imports in domain, infra, agents, or toolkit.
#
# KNOWN DEBT (`controller -> cli`, 11 sites, all pre-existing):
#   controller/api_service.py  5  (COMMAND_SPECS, risk_preview_cmd, proof_cmd x2, secrets_cmd)
#   controller/preflight.py    5  (cli.services: build_graph, prepare, plan_from_spec x2)
#   controller/check_gate.py   2  (cli.proof_cmd)
#   controller/cell_runner.py  1  (cli.services: Prepared, engine_for)
# The fix is to move the view/payload builders down into controller/ and have
# the CLI import them from there. It is a real refactor and is NOT done here.
#
# Two consequences worth naming, because they are why this is debt and not a
# style preference:
#   1. `controller` cannot be consumed as a library without pulling in `click`
#      and the entire CLI module tree.
#   2. Every one of those 11 imports is function-local, i.e. they exist to dodge
#      an import cycle — which is also why `ruff`'s PLC0415 fires on them. The
#      per-file PLC0415 ignores in this file are a consequence of THIS debt,
#      not independent of it.
name = "Nothing below the controller imports the CLI layer"
type = "forbidden"
source_modules = [
    "mayhem.domain",
    "mayhem.infra",
    "mayhem.agents",
    "mayhem.toolkit",
]
forbidden_modules = ["mayhem.cli"]
