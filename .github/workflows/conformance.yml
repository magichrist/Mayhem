name: Live Conformance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-conformance:
    name: live conformance (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --quiet uv
      - run: uv sync --group dev
      - name: Record conformance environment
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > conformance-environment.txt
          uname -a >> conformance-environment.txt
          docker version --format '{{.Server.Version}}' >> conformance-environment.txt 2>&1 || true
          kubectl version -o json >> conformance-environment.txt 2>&1 || true
      - name: Run unit conformance profile
        run: uv run pytest tests/unit -m nightly -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-environment
          path: conformance-environment.txt
          if-no-files-found: error
