name: Release to PyPI
on:
  push:
    tags:
      # Both conventions fire the release: `v0.5.0` and the repo's
      # existing numeric tags (`0.5.0`, `0.5.0dev`). hatch-vcs strips a
      # leading `v`, so either produces a clean PEP 440 version.
      - "v*"
      - "[0-9]*"

permissions:
  contents: read
  id-token: write # trusted publishing (OIDC) — no PyPI token secret required

# A second tag push while a release is mid-flight would otherwise run two
# publish jobs concurrently and race on the same PyPI version. Cancel the older
# one; the newer tag is the one that should ship.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --quiet uv
      - name: Sync dev dependencies
        run: uv sync --group dev
      - name: Run unit tests
        run: uv run pytest tests/unit
      - name: Run integration tests
        run: uv run pytest tests/integration
      # Lint and type gates. Previously NOT gated: this file carried a NOTE
      # saying `ruff check src/` reported "30-49 pre-existing violations under
      # every ruff generation (0.8-0.16)" so linting was disabled rather than
      # fixed. Under the pinned toolchain (ruff 0.16.9) the real count was 26
      # in src/ and 60 in tests/. All of them are now fixed or justified by a
      # per-file ignore that states WHY in pyproject.toml, so the gate is green
      # and a new violation fails the build instead of being discovered later.
      - name: Lint (ruff)
        run: uv run ruff check src/ tests/
      - name: Type check (mypy, strict)
        run: uv run mypy src/mayhem
      # Architecture contracts. `test_import_contracts.py` shells out to
      # `lint-imports`, so it is already covered by the unit run above; this
      # step exists so a missing `lint-imports` binary fails here loudly with a
      # named cause instead of silently skipping the contract assertions.
      - name: Architecture contracts (import-linter)
        run: uv run lint-imports --config pyproject.toml
      - name: Regression gate
        # Plan 01 Phase 5's release-time half. On a fresh checkout there is no
        # certification database, so this reports zero live claims and exits
        # clean: the honest zero, not a pass over the catalogue. It is here so
        # the release pipeline carries the same command as the nightly one, and
        # so a store with claims in it would block a release rather than being
        # discovered afterwards. The nightly job is where the claims live.
        run: uv run mayhem certify regress --db certification.db --json

  build-and-publish:
    name: Build and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Full history so hatch-vcs can resolve the invoking tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      # Trusted Publishing: authenticates via OIDC against the Trusted
      # Publisher configured on pypi.org for this repository (owner
      # magichrist, repo Mayhem, workflow release.yml). Do NOT add a
      # username/password here — the action would try token auth.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github-release:
    name: Create GitHub release from cliff changelog
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      # Full history + tags so git-cliff can resolve commit ranges.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install git-cliff
        run: |
          curl -sSL -o /tmp/git-cliff.tar.gz \
            https://github.com/orhun/git-cliff/releases/download/v2.14.1/git-cliff-2.14.1-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          sudo install -m755 /tmp/git-cliff-*/git-cliff /usr/local/bin/git-cliff
          git-cliff --version
      # NOTE: names the invoking tag explicitly (`--tag`) instead of using
      # `--latest` — when HEAD sits exactly on the tag (always true for a
      # tag-push checkout) `--latest` degrades to a single-commit section.
      # `--tag "$GITHUB_REF_NAME"` renders the same latest-release notes for
      # both tag conventions (`0.5.1` and `v0.5.1`).
      - name: Render release notes
        run: git-cliff --config cliff.toml --tag "$GITHUB_REF_NAME" --strip header -o /tmp/body.md
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/body.md